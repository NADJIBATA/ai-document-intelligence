# Ephemeral dependencies for the backend integration tests.
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && pytest
#   docker compose -f docker-compose.test.yml down -v
# Ports differ from the main stack (5433 / 6380 / 9002 / 6335) so both can run side by side.
# MinIO no longer publishes official images: MINIO_IMAGE defaults to the maintained
# community build (any S3-compatible server works, the code only speaks S3).

name: docintel-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-test:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9002:9000"
    tmpfs:
      - /data

  qdrant-test:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.4}
    ports:
      - "127.0.0.1:6335:6333"
    tmpfs:
      - /qdrant/storage
