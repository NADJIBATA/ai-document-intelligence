# Static file server of the frontend image (single-page application).
# Security headers, compression of API responses and routing live in the edge nginx
# (nginx/nginx.conf); this server only knows about the built files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # The HTML must always be revalidated: it references the hashed bundles of the
    # current release.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Hashed file names (Vite): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/documents/..., /chat/...) all serve the application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
