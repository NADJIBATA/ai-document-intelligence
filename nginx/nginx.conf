# Edge reverse proxy: the only service published on the host.
#
#   /                       -> frontend (static single-page application)
#   /api/, /health, /ready  -> backend (FastAPI)
#   /docs, /openapi.json    -> backend (404 when ENABLE_DOCS=false)
#   /metrics                -> denied (scraped by Prometheus on the internal network)
#
# Mounted as a template by docker-compose.yml: the official image replaces
# ${MAX_UPLOAD_SIZE_MB} with the environment value at start-up (only variables that are
# defined in the environment are replaced; nginx variables like $host are untouched).

# Docker's embedded DNS. Upstreams are resolved at request time (variables in
# proxy_pass): a recreated backend container gets a new IP without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Keep the request id sent by the client (or the frontend), otherwise create one.
map $http_x_request_id $docintel_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format docintel_json escape=json
    '{"time":"$time_iso8601","service":"nginx","request_id":"$docintel_request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # The query string is not logged ($uri, not $request_uri): it never carries
    # secrets in this application, but the rule is simpler to audit this way.
    access_log /dev/stdout docintel_json;

    # Uploads: same limit as the backend. Above it nginx answers itself, with the same
    # JSON error format as the API.
    client_max_body_size ${MAX_UPLOAD_SIZE_MB}m;
    client_body_timeout 120s;
    error_page 413 = @payload_too_large;

    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, not appended: a client cannot forge the address used for rate
    # limiting (uvicorn trusts this header because only nginx can reach it).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $docintel_request_id;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /metrics {
        return 404;
    }

    location /api/ {
        # LLM answers, structured extraction: allow slow upstream responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Uploads are streamed to the backend instead of being buffered on disk first.
        proxy_request_buffering off;
        proxy_pass $backend_upstream;
    }

    location = /health {
        access_log off;
        proxy_pass $backend_upstream;
    }

    location = /ready {
        proxy_pass $backend_upstream;
    }

    location = /docs {
        proxy_pass $backend_upstream;
    }

    location = /openapi.json {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }

    location @payload_too_large {
        default_type application/json;
        add_header X-Request-ID $docintel_request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"The file exceeds the maximum size of ${MAX_UPLOAD_SIZE_MB} MB.","request_id":"$docintel_request_id"}}';
    }
}
